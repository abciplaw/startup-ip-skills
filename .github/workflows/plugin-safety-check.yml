# Runs the checks described in SECURITY.md on every change.
# The plugin folder (abciplaw/) must contain only text instructions and metadata.
name: Plugin safety check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Plugin folder holds Markdown and JSON only
        run: |
          out=$(git -c core.quotepath=off ls-files abciplaw | grep -vE '\.(md|json)$' || true)
          if [ -n "$out" ]; then echo "Unexpected files:"; echo "$out"; exit 1; fi

      - name: No executable files in the repository
        run: |
          out=$(git ls-files -s | awk '$1 != "100644"')
          if [ -n "$out" ]; then echo "Files with unexpected modes:"; echo "$out"; exit 1; fi

      - name: No code-running plugin components or permission grants
        run: |
          out=$(git ls-files abciplaw | grep -E '(^|/)(hooks|bin|monitors|workflows)/|\.mcp\.json$|\.lsp\.json$|package\.json$' || true)
          out="$out$(grep -rnE '"(hooks|mcpServers|lspServers|monitors|commands|agents|workflows)"' abciplaw --include='*.json' || true)"
          out="$out$(grep -rnE '^(allowed-tools|hooks|shell|context|agent):|!`' abciplaw || true)"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: Only allowed external URLs
        run: |
          out=$(grep -rhoE 'https?://[^ )>"`<]*[^ )>"`<.,;:]' abciplaw | sort -u \
            | grep -vxE 'https://abcip\.co\.kr|https://github\.com/abciplaw/startup-ip-skills(\.git|/blob/main/SECURITY\.md)?' || true)
          if [ -n "$out" ]; then echo "Unexpected URLs:"; echo "$out"; exit 1; fi

      - name: No invisible or bidirectional control characters
        run: |
          out=$(perl -CSD -ne 'print "$ARGV:$.\n" if /[\x{200B}-\x{200F}\x{202A}-\x{202E}\x{2060}-\x{2064}\x{FEFF}]/; close ARGV if eof' $(git ls-files abciplaw))
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: Versions agree
        run: |
          v=$(python3 -c 'import json;print(json.load(open("abciplaw/.claude-plugin/plugin.json"))["version"])')
          grep -q "(단일 파일판, v$v)" abciplaw/PROMPT.md || { echo "PROMPT.md is not v$v"; exit 1; }
